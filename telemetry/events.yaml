# Ana M product analytics event catalog (machine SoT).
# Human mirror: events.md. Typed consumer: @anam/telemetry catalog module.
# Source of truth host: Ana-M-APP/anam-telemetry-docs (this file).
# Consumers: Ana-M-APP/anam-telemetry generates typed TS from this YAML.

catalog:
  version: "0.2.1"
  schema_version: 1
  notes: >
    SoT for Ana M product analytics. Consumed by @anam/telemetry (codegen).
    Slice-1 Gold Auth + Auth/Account + Stripe billing via anam-telemetry
    (webhooks → Mixpanel + GA4 with Ana M UID). Stripe Marketplace only
    configures Mixpanel projects — product billing events are emitted by
    anam-telemetry, NOT the marketplace app. Dedupe by Stripe event id.
    Isolation contract (telemetry must not block auth/payments/reconciliation/access):
    telemetry/isolation.md — do not fork conflicting copies.

destinations:
  - mixpanel
  - ga4
  - both
  - ops_only
  - none

events:
  page_viewed:
    destinations: ga4
    ga4_name: page_view
    where: fe
  signup_started:
    destinations: mixpanel
    where: fe
  signup_failed:
    destinations: mixpanel
    where: fe
  sign_up:
    destinations: both
    ga4_name: sign_up
    where: be
  account_created:
    destinations: both
    ga4_name: account_created
    where: be
  login_completed:
    destinations: both
    ga4_name: login
    where: fe
  onboarding_step_completed:
    destinations: mixpanel
    where: fe
  onboarding_completed:
    destinations: mixpanel
    where: fe
  trial_started:
    destinations: both
    ga4_name: trial_started
    where: be

  # Stripe billing (anam-telemetry webhooks — Mixpanel + GA4, Ana M UID)
  stripe_invoice_paid:
    destinations: both
    ga4_name: purchase
    where: be
  stripe_invoice_payment_failed:
    destinations: both
    ga4_name: stripe_invoice_payment_failed
    where: be
  stripe_subscription_created:
    destinations: both
    ga4_name: stripe_subscription_created
    where: be
  stripe_subscription_updated:
    destinations: both
    ga4_name: stripe_subscription_updated
    where: be
  stripe_subscription_deleted:
    destinations: both
    ga4_name: stripe_subscription_deleted
    where: be

  # Gold lifecycle aliases still usable when domain emits them directly
  first_subscription_paid:
    destinations: both
    ga4_name: first_subscription_paid
    where: be
  refund:
    destinations: both
    ga4_name: refund
    where: be
  subscription_cancelled:
    destinations: both
    ga4_name: subscription_cancelled
    where: be
  subscription_reactivated:
    destinations: both
    ga4_name: subscription_reactivated
    where: be
  subscription_plan_changed:
    destinations: both
    ga4_name: subscription_plan_changed
    where: be
  purchase:
    destinations: both
    ga4_name: purchase
    where: be

  account_created_error:
    destinations: mixpanel
    where: fe
  account_deleted_block_reactivate_failed:
    destinations: mixpanel
    where: fe
  account_deleted_block_reactivate_success:
    destinations: mixpanel
    where: fe
  account_deletion_abandoned:
    destinations: mixpanel
    where: fe
  account_deletion_confirmed:
    destinations: mixpanel
    where: fe
  account_deletion_export_requested:
    destinations: mixpanel
    where: fe
  account_deletion_failed:
    destinations: mixpanel
    where: fe
  account_deletion_requested:
    destinations: mixpanel
    where: be
  account_deletion_reverted:
    destinations: mixpanel
    where: be
  account_switched:
    destinations: mixpanel
    where: fe
  account_assistant_access_suspended:
    destinations: mixpanel
    where: both
  account_assistant_invite_accepted:
    destinations: mixpanel
    where: both
  account_assistant_invite_cancelled:
    destinations: mixpanel
    where: both
  account_assistant_invite_sent:
    destinations: mixpanel
    where: both
  account_assistant_login:
    destinations: mixpanel
    where: both
  configuration_preferences_updated_error:
    destinations: mixpanel
    where: fe
  configuration_preferences_updated_success:
    destinations: mixpanel
    where: fe
  login_error:
    destinations: mixpanel
    where: fe
  password_reset_email_sent_error:
    destinations: mixpanel
    where: fe
  password_reset_email_sent_success:
    destinations: mixpanel
    where: fe
  password_reset_error:
    destinations: mixpanel
    where: fe
  password_reset_success:
    destinations: mixpanel
    where: fe
  account_email_change_requested:
    destinations: mixpanel
    where: fe
  account_password_changed:
    destinations: mixpanel
    where: fe

  # Seasonal FE easter egg (Halloween logo ghost)
  halloween_easter_egg_clicked:
    destinations: both
    ga4_name: halloween_easter_egg_clicked
    where: fe

aliases:
  signup: sign_up
  account_created_success: account_created
  login: login_completed
  signup_error: signup_failed
  assistant_access_suspended: account_assistant_access_suspended
  assistant_invite_accepted: account_assistant_invite_accepted
  assistant_invite_cancelled: account_assistant_invite_cancelled
  assistant_invite_sent: account_assistant_invite_sent
  assistant_login: account_assistant_login
  profile_email_change_requested: account_email_change_requested
  profile_password_changed: account_password_changed
  stripe_subscription_trial_created: trial_started
  # Stripe webhook type → catalog event (when callers pass raw Stripe type strings)
  "invoice.paid": stripe_invoice_paid
  "invoice.payment_succeeded": stripe_invoice_paid
  "invoice.payment_failed": stripe_invoice_payment_failed
  "customer.subscription.created": stripe_subscription_created
  "customer.subscription.updated": stripe_subscription_updated
  "customer.subscription.deleted": stripe_subscription_deleted

fe_suppressed:
  - account_created_success
  - account_created
  - sign_up
  - enterprise_account_created_success
  - enterprise_account_created_error
