# Ana M product analytics event catalog (machine SoT).
# Human mirror: events.md. Typed consumer: @anam/telemetry catalog module.
# Source of truth host: Ana-M-APP/anam-telemetry-docs (this file).
# Consumers: Ana-M-APP/anam-telemetry generates typed TS from this YAML.

catalog:
  version: "0.2.4"
  schema_version: 1
  notes: >
    SoT for Ana M product analytics. Consumed by @anam/telemetry (codegen).
    Slice-1 Gold Auth + Auth/Account + Stripe billing via anam-telemetry
    (webhooks → Mixpanel + GA4 with Ana M UID). Stripe Marketplace only
    configures Mixpanel projects — product billing events are emitted by
    anam-telemetry, NOT the marketplace app. Dedupe by Stripe event id.
    Identity People / user_properties allowlist lives under `identity:` below
    (not event destinations). Empty/undefined values must be omitted at emit.

# Professional identity only (no clinical PII). Used by Mixpanel people.set
# and GA4 user_properties on identify/trackUser — not as event params.
identity:
  mixpanel_people:
    - $name
    - $email
    - $phone
    - $created
    - anam_user_id
    - anam_origin
    - anam_profession
    - anam_field_of_work
    - anam_language
    - anam_last_login_at
  ga4_user_properties:
    - name
    - email
    - phone
    - anam_user_id
    - anam_account_id
    - anam_origin
    - anam_profession
    - anam_field_of_work
    - anam_language
    - anam_signup_at
    - anam_last_login_at
  notes: >
    Person identity = Ana M UID (Mixpanel distinct_id/$user_id, GA4 user_id).
    Account = Mixpanel Group key account_id only (mirrored as GA4
    user_property anam_account_id). Ana custom props MUST use anam_* —
    never bare invented names. Platform reserved ($name/$email/$phone/
    $created, GA user_id) keep vendor names; GA name/email/phone are the
    dual of Mixpanel $name/$email/$phone. anam_last_login_at is ISO8601
    from Users.lastLoginAt (prefer SetupTrackers lastLoginAt over Intercom
    dd/MM/yyyy userLastLoginAt). Do not invent props beyond this allowlist.
    Omit null/undefined/empty/"undefined" string values. Geo IP remains off
    (Mixpanel browser ip:false).
