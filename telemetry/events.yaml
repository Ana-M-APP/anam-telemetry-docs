# Ana M product analytics event catalog (machine SoT).
# Human mirror: events.md. Typed consumer: @anam/telemetry catalog module.
# Source of truth host: Ana-M-APP/anam-telemetry-docs (this file).
# Consumers: @anam/telemetry (monorepo packages/telemetry) generates typed TS from this YAML.

catalog:
  version: "0.6.1"
  schema_version: 1
  notes: |
    SoT for Ana M product analytics. Consumed by @anam/telemetry (codegen). ONLY Christian-liberated (checklist `live`) events may fan out to Mixpanel or GA4. All other catalog rows use destinations: none (suspended) until explicitly liberated — including HOLD deletion/assistants/prefs, pageviews, and Stripe subscription lifecycle stubs (`stripe_subscription_*`). Wave-1 rename: product events use anam_* English snake_case with market participle/state. Event props may omit anam_ prefix (account_id, amount, reason, …) because the event name already namespaces. Identity People / Group / user_properties allowlist lives under `identity:` — shared active-account + membership + subscription commercial attrs (`anam_account_id`, `anam_signup_origin`, `anam_member_*`, `anam_billing_*`, `anam_plan_*`, `anam_subscription_status`) across Mixpanel and GA4. Intercom Company may mirror commercial attrs (optional REST); Intercom People does not carry plan/status. Catalog 0.4.4: subscription funnel product events (`anam_subscription_trial_*`, `anam_subscription_paid_*`) + subscription identity attrs; generic `stripe_subscription_*` stay HOLD. Catalog 0.4.3: live Mixpanel/GA events declare per-event `props` allowlists; adapters strip anything else before track (envelope + Group key remain adapter-owned). Catalog 0.4.2: Mixpanel HTTP attaches Group key anam_account_id from the operation account; Intercom JWT nests company.company_id (= Account ID) separately from People attr anam_account_id. Stripe Marketplace only configures Mixpanel projects — product billing events are emitted by anam-telemetry, NOT the marketplace app. Dedupe by Stripe event id (+ funnel suffix). Empty/undefined values must be omitted at emit.
identity:
  mixpanel_people:
    - $name
    - $email
    - $phone
    - $created
    - anam_user_id
    - anam_account_id
    - anam_signup_origin
    - anam_signup_channel
    - anam_last_login_at
    - anam_member_profession
    - anam_member_field_of_work
    - anam_member_sessions_per_month
    - anam_member_role
    - anam_member_session_value
    - anam_member_session_currency
    - anam_billing_provider
    - anam_plan_key
    - anam_billing_price_id
    - anam_plan_name
    - anam_subscription_status
  mixpanel_group:
    - anam_billing_provider
    - anam_plan_key
    - anam_billing_price_id
    - anam_plan_name
    - anam_subscription_status
  ga4_user_properties:
    - name
    - email
    - phone
    - anam_user_id
    - anam_account_id
    - anam_signup
    - anam_signup_origin
    - anam_signup_channel
    - anam_last_login_at
    - anam_member_profession
    - anam_member_field_of_work
    - anam_member_sessions_per_month
    - anam_member_role
    - anam_member_session_value
    - anam_member_session_currency
    - anam_billing_provider
    - anam_plan_key
    - anam_billing_price_id
    - anam_plan_name
    - anam_subscription_status
  notes: |
    Person identity = Ana M UID (Mixpanel distinct_id/$user_id, GA4 user_id). Active / operation account = singular anam_account_id (Mixpanel Group key + People + GA4 user_property). Subscription commercial state belongs to the **account** (Group Profile SoT); People/GA mirror the active account only. Server HTTP sets Group as anam_account_id:[id]; legacy event prop account_id is compatible when it agrees — conflicts set anam_account_group_conflict and skip Group (no silent pick). Intercom: People attr anam_account_id ≠ Companies company_id; JWT nests company.company_id = Account ID. Commercial plan/status CDAs live on Intercom Company when configured — not on Intercom People. Membership attrs (profession / field_of_work / sessions_per_month / role owner|assistant / session_value) and user-scoped signup_origin / last_login_at are shared with Intercom People — same anam_* names. Ana custom props MUST use anam_* — never bare invented names. Platform reserved ($name/$email/$phone/$created, GA user_id) keep vendor names; GA name/email/phone are the dual of Mixpanel $name/$email/$phone. GA signup dual of Mixpanel $created is anam_signup (ISO8601). Omit null/undefined/empty/"undefined" string values. Mixpanel browser geo IP is on (ip:true) for Country/Region/City enrichment; Session Replay + autocapture use privacy-safe defaults (mask all text/inputs; no element text / form values; no canvas/network). GA4 browser geo depends on GTM tag + consent on the same G- stream. GA4 MP / Mixpanel HTTP may set ip_override / ip only on user-facing API tracks with a trusted client IP — never Stripe webhooks. Event and custom prop identifiers MUST be English snake_case. Stripe invoice event props: amount (invoice major units), currency, account_id, stripe_customer_id, source — no plan on invoice events. Subscription funnel events carry account_id + reason where applicable; plan/status live on identity. Do NOT send language on Mixpanel/GA People. Group Profile commercial attrs are written via Mixpanel /groups (fail-open); counters/backfill remain a separate wave.
destinations:
  - mixpanel
  - ga4
  - both
  - ops_only
  - none
