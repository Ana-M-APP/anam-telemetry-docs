  sign_up: anam_signed_up
  account_created: anam_account_created
  account_created_success: anam_account_created
  account_created_error: anam_account_create_failed
  login: anam_login_completed
  login_completed: anam_login_completed
  login_error: anam_login_failed
  signup_failed: anam_signup_failed
  signup_error: anam_signup_failed
