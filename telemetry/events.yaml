    where: fe
  account_deletion_export_requested:
    destinations: mixpanel
    where: fe
  account_deletion_failed:
    destinations: mixpanel
    where: fe
  account_deletion_requested:
    destinations: mixpanel
    where: be
  account_deletion_reverted:
    destinations: mixpanel
    where: be
  account_switched:
    destinations: mixpanel
    where: fe
  account_assistant_access_suspended:
    destinations: mixpanel
    where: both
  account_assistant_invite_accepted:
    destinations: mixpanel
