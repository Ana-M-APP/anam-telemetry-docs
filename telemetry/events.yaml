# Ana M product analytics event catalog (machine SoT).
# Human mirror: events.md. Typed consumer: @anam/telemetry catalog module.
# Source of truth host: Ana-M-APP/anam-telemetry-docs (this file).
# Consumers: @anam/telemetry (monorepo packages/telemetry) generates typed TS from this YAML.

catalog:
  version: "0.3.0"
  schema_version: 1
  notes: >
    SoT for Ana M product analytics. Consumed by @anam/telemetry (codegen).
    Wave-1 rename: product events use anam_* English snake_case with market
    participle/state (*_created / *_completed / *_failed). Event props may omit
    anam_ prefix (account_id, amount, …). Identity People / user_properties
    allowlist lives under `identity:` (Mixpanel/GA no longer receive origin /
    profession / field_of_work / language — those are Intercom member_* only).
    Stripe Marketplace only configures Mixpanel projects — product billing
    events are emitted by anam-telemetry, NOT the marketplace app. Dedupe by
    Stripe event id. Empty/undefined values must be omitted at emit.

# Professional identity only (no clinical PII). Used by Mixpanel people.set
# and GA4 user_properties on identify/trackUser — not as event params.
identity:
  mixpanel_people:
    - $name
    - $email
    - $phone
    - $created
    - anam_user_id
    - anam_last_login_at
  ga4_user_properties:
    - name
    - email
    - phone
    - anam_user_id
    - anam_account_id
    - anam_signup
    - anam_last_login_at
  notes: >
    Person identity = Ana M UID (Mixpanel distinct_id/$user_id, GA4 user_id).
    Account = Mixpanel Group key anam_account_id (mirrored as GA4
    user_property anam_account_id). Ana custom props MUST use anam_* —
    never bare invented names. Platform reserved ($name/$email/$phone/
    $created, GA user_id) keep vendor names; GA name/email/phone are the
    dual of Mixpanel $name/$email/$phone. GA signup dual of Mixpanel
    $created is anam_signup (ISO8601). anam_last_login_at is ISO8601 from
    Users.lastLoginAt. Do NOT send origin/profession/field_of_work/language
    on Mixpanel/GA (Intercom-only member_* attrs). Omit null/undefined/empty/
    "undefined" string values. Geo IP remains off (Mixpanel browser ip:false).
    Event and custom prop identifiers MUST be English snake_case. Stripe
    billing event props: amount (invoice major units), currency, account_id,
    stripe_customer_id, source — no plan / plan_id in this wave.

destinations:
  - mixpanel
  - ga4
  - both
  - ops_only
  - none

events:
  page_viewed:
    destinations: ga4
    ga4_name: page_view
    where: fe
  signup_started:
    destinations: mixpanel
    where: fe
  anam_signup_failed:
    destinations: mixpanel
    where: fe
  anam_signed_up:
    destinations: both
    ga4_name: sign_up
    where: be
  anam_account_created:
    destinations: both
    ga4_name: anam_account_created
    where: be
  anam_login_completed:
    destinations: both
    ga4_name: login
    where: fe
  onboarding_step_completed:
    destinations: mixpanel
    where: fe
  onboarding_completed:
    destinations: mixpanel
    where: fe
  anam_subscription_trial_started:
    destinations: both
    ga4_name: anam_subscription_trial_started
    where: be

  # Stripe billing (anam-telemetry webhooks — Mixpanel + GA4, Ana M UID)
