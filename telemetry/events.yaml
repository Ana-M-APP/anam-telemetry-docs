# Ana M product analytics event catalog (machine SoT).
# Human mirror: events.md. Typed consumer: @anam/telemetry catalog module.
# Source of truth host: Ana-M-APP/anam-telemetry-docs (this file).
# Consumers: @anam/telemetry (monorepo packages/telemetry) generates typed TS from this YAML.

catalog:
  version: "0.4.1"
  schema_version: 1
  notes: >
    SoT for Ana M product analytics. Consumed by @anam/telemetry (codegen).
    ONLY Christian-liberated (checklist `live`) events may fan out to Mixpanel
    or GA4. All other catalog rows use destinations: none (suspended) until
    explicitly liberated — including HOLD deletion/assistants/prefs, pageviews,
    and Stripe subscription lifecycle stubs. Wave-1 rename: product events use
    anam_* English snake_case with market participle/state. Event props may omit
    anam_ prefix (account_id, amount, …). Identity People / user_properties
    allowlist lives under `identity:` — shared active-account + membership attrs
    (`anam_account_id`, `anam_signup_origin`, `anam_member_*`) across Mixpanel,
    GA4, and Intercom. Catalog 0.4.0 adds customer + session product events
    (`anam_customer_*`, `anam_session_*`); soft-delete session = archived;
    clinical record enhance module → `anam_clinical_record_*` (requested /
    created / failed). No clinical content in props. Stripe Marketplace only
    configures Mixpanel projects —
    product billing events are emitted by anam-telemetry, NOT the marketplace
    app. Dedupe by Stripe event id. Empty/undefined values must be omitted at emit.

# Professional identity only (no clinical PII). Used by Mixpanel people.set
# and GA4 user_properties on identify/trackUser — not as event params.
identity:
  mixpanel_people:
    - $name
    - $email
    - $phone
    - $created
    - anam_user_id
    - anam_account_id
    - anam_signup_origin
    - anam_last_login_at
    - anam_member_profession
    - anam_member_field_of_work
    - anam_member_sessions_per_month
    - anam_member_role
    - anam_member_session_value
  ga4_user_properties:
    - name
    - email
    - phone
    - anam_user_id
    - anam_account_id
    - anam_signup
    - anam_signup_origin
    - anam_last_login_at
    - anam_member_profession
    - anam_member_field_of_work
    - anam_member_sessions_per_month
    - anam_member_role
    - anam_member_session_value
  notes: >
    Person identity = Ana M UID (Mixpanel distinct_id/$user_id, GA4 user_id).
    Active account = singular anam_account_id (Mixpanel Group key + People +
    GA4 user_property). Membership attrs (profession / field_of_work /
    sessions_per_month / role owner|assistant / session_value) and user-scoped
    signup_origin / last_login_at are shared with Intercom — same anam_* names.
    Ana custom props MUST use anam_* — never bare invented names. Platform
    reserved ($name/$email/$phone/$created, GA user_id) keep vendor names; GA
    name/email/phone are the dual of Mixpanel $name/$email/$phone. GA signup
    dual of Mixpanel $created is anam_signup (ISO8601). Omit null/undefined/
    empty/"undefined" string values. Mixpanel browser geo IP is on (ip:true)
    for Country/Region/City enrichment; Session Replay + autocapture use
    privacy-safe defaults (mask all text/inputs; no element text / form
    values; no canvas/network). GA4 browser geo depends on GTM tag + consent
    on the same G- stream. GA4 MP / Mixpanel HTTP may set ip_override / ip
    only on user-facing API tracks with a trusted client IP — never Stripe
    webhooks. Event and custom prop identifiers MUST be English snake_case.
    Stripe billing event props: amount (invoice major units), currency,
    account_id, stripe_customer_id, source — no plan / plan_id in this wave.
    Do NOT send language on Mixpanel/GA People.

